name: Watch upstream Codex releases

on:
  schedule:
    # 06:30 Asia/Shanghai
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Find latest stable rust release and dispatch a build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./scripts/watch-upstream.sh
